[package]
name = "rs-io"
version = "0.4.2"
edition = "2024"
authors = ["RustCityRS"]
description = "Protocol I/O, Jag, Js5, CRC & Compression"
license = "MIT"
repository = "https://github.com/RustCityRS/rs-io"
homepage = "https://github.com/RustCityRS/rs-io"
readme = "README.md"
include = ["src/**/*", "csrc/**/*", "build.rs", "LICENSE.md", "README.md"]

[features]
default = ["bz-error-handler"]
bz-error-handler = []

[build-dependencies]
cc = "1.2"

[dependencies]
rs-crypto = "0.3"
crc32fast = "1"
lzma-rs = "0.3"
memchr = "2"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
